<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin — MF Barber Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        :root { --rojo:#A71925;--rojo-hover:#C51F2C;--negro:#080808;--navbar:#0D0D0D;--card:#151515;--texto:#F5F5F5;--texto-sec:#A6A6A6;--borde:#292929; }
        body { background:var(--negro);color:var(--texto);min-height:100vh;font-family:'Rajdhani',sans-serif; }
        .navbar { background:var(--navbar);border-bottom:1px solid var(--borde);padding:0.8rem 2rem;position:sticky;top:0;z-index:999; }
        .navbar-brand { display:flex;align-items:center;gap:12px;text-decoration:none; }
        .navbar-brand img { height:40px;filter:invert(1); }
        .navbar-brand span { font-family:'Bebas Neue';font-size:1.5rem;letter-spacing:4px;color:var(--texto); }
        .btn-salir { background:transparent;border:1px solid var(--borde);color:var(--texto-sec);font-family:'Oswald';letter-spacing:2px;font-size:12px;padding:6px 15px;border-radius:4px;transition:all 0.3s;cursor:pointer; }
        .btn-salir:hover { border-color:var(--rojo);color:var(--rojo); }
        .page-title { font-family:'Bebas Neue';letter-spacing:5px;color:var(--texto);font-size:2rem;margin-bottom:3px; }
        .page-sub { font-family:'Oswald';color:var(--texto-sec);letter-spacing:3px;font-size:12px; }
        .nav-tabs { border-color:var(--borde); }
        .nav-tabs .nav-link { font-family:'Oswald';letter-spacing:2px;color:var(--texto-sec);background:transparent;border-color:transparent;font-size:13px;padding:10px 20px; }
        .nav-tabs .nav-link.active { color:#ffffff;background:rgba(167,25,37,0.15);border-color:var(--rojo) var(--rojo) transparent;border-bottom:2px solid var(--rojo); }
        .nav-tabs .nav-link:hover { color:var(--texto); }
        .section-title { font-family:'Bebas Neue';letter-spacing:4px;color:var(--texto);font-size:1.5rem; }
        .btn-rojo { background:var(--rojo);color:#fff;font-family:'Oswald';letter-spacing:2px;padding:8px 20px;border:none;border-radius:4px;transition:all 0.3s;cursor:pointer; }
        .btn-rojo:hover { background:var(--rojo-hover);color:#fff; }
        .btn-borde { background:transparent;border:1px solid var(--borde);color:var(--texto-sec);font-family:'Oswald';letter-spacing:2px;font-size:12px;padding:6px 15px;border-radius:4px;transition:all 0.3s;cursor:pointer; }
        .btn-borde:hover { border-color:var(--rojo);color:var(--rojo); }
        .form-label { font-family:'Oswald';color:var(--texto-sec);font-size:11px;letter-spacing:3px; }
        .form-control { background:rgba(255,255,255,0.03)!important;border:1px solid var(--borde)!important;color:var(--texto)!important;border-radius:4px; }
        .form-control:focus { border-color:var(--rojo)!important;box-shadow:0 0 10px rgba(167,25,37,0.2)!important; }
        .serv-card { background:var(--card);border:1px solid var(--borde);border-radius:8px;overflow:hidden;transition:all 0.3s; }
        .serv-card:hover { border-color:var(--rojo); }
        .serv-card img { width:100%;height:150px;object-fit:cover; }
        .serv-body { padding:1rem; }
        .serv-nombre { font-family:'Oswald';color:var(--texto);font-size:13px;margin-bottom:3px; }
        .serv-precio { font-family:'Bebas Neue';font-size:1.5rem;color:var(--rojo);margin-bottom:8px; }
        footer { background:var(--navbar);border-top:1px solid var(--borde);padding:15px;text-align:center;color:var(--texto-sec);font-family:'Oswald';font-size:12px;letter-spacing:2px;margin-top:3rem; }
        footer span { color:var(--rojo); }
    </style>
</head>
<body>
<nav class="navbar d-flex justify-content-between align-items-center">
    <a class="navbar-brand" href="index.html">
        <img src="img/logo.jpg" alt="logo">
        <span>MF BARBER — ADMIN</span>
    </a>
    <div class="d-flex align-items-center gap-3">
        <span style="font-family:'Oswald';color:var(--texto-sec);font-size:13px;">
            <i class="bi bi-shield-check me-1" style="color:var(--rojo);"></i>
            <span id="nombreAdmin"></span>
        </span>
        <button onclick="cerrarSesion()" class="btn-salir"><i class="bi bi-box-arrow-right me-1"></i>Salir</button>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="page-title">Panel <span style="color:var(--rojo);">Administrador</span></h2>
    <p class="page-sub">MF BARBER STUDIO 2026</p>

    <ul class="nav nav-tabs mt-4 mb-4">
        <li class="nav-item">
            <button class="nav-link active" onclick="mostrarTab('reservas')" id="tabReservas">
                <i class="bi bi-calendar-check me-1"></i>RESERVAS
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" onclick="mostrarTab('servicios')" id="tabServicios">
                <i class="bi bi-scissors me-1"></i>SERVICIOS
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" onclick="mostrarTab('barberos')" id="tabBarberos">
                <i class="bi bi-person-badge me-1"></i>BARBEROS
            </button>
        </li>
        <li class="nav-item">
            <a href="cierres.html"
               style="font-family:'Oswald';letter-spacing:2px;color:rgba(245,240,232,0.6);background:transparent;border:none;font-size:13px;padding:10px 20px;display:block;text-decoration:none;transition:all 0.3s;"
               onmouseover="this.style.color='#A71925'"
               onmouseout="this.style.color='rgba(245,240,232,0.6)'">
                <i class="bi bi-graph-up me-1"></i>CIERRES
            </a>
        </li>
    </ul>

    <div id="seccionReservas">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="section-title mb-0">Todas las Reservas</h4>
            <button onclick="cargarTodasReservas()" class="btn-borde">
                <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
            </button>
        </div>
        <div id="todasReservas"></div>
    </div>

    <div id="seccionServicios" style="display:none;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="section-title mb-0">Gestion de Servicios</h4>
            <button onclick="mostrarFormServicio()" class="btn-rojo">
                <i class="bi bi-plus-circle me-1"></i>Nuevo Servicio
            </button>
        </div>

        <div id="formServicio" style="display:none;background:var(--card);border:1px solid var(--borde);border-radius:8px;padding:1.5rem;" class="mb-4">
            <h5 id="tituloForm" style="font-family:'Bebas Neue';letter-spacing:3px;color:var(--texto);margin-bottom:1rem;">Nuevo Servicio</h5>
            <input type="hidden" id="servicioId">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">NOMBRE DEL CORTE *</label>
                    <input type="text" id="nombreServicio" class="form-control mt-1" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">PRECIO *</label>
                    <input type="number" id="precioServicio" class="form-control mt-1" value="17000" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">IMAGEN</label>
                    <input type="file" id="imagenFile" accept="image/*" class="form-control mt-1" onchange="previsualizarImagen(this)">
                    <input type="hidden" id="imagenServicio">
                </div>
                <div class="col-12" id="previewContainer" style="display:none;">
                    <img id="previewImg" style="height:100px;border-radius:6px;border:1px solid var(--borde);">
                </div>
                <div class="col-12">
                    <label class="form-label">DESCRIPCION</label>
                    <textarea id="descripcionServicio" class="form-control mt-1" rows="2"></textarea>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button onclick="guardarServicio()" class="btn-rojo"><i class="bi bi-check-lg me-1"></i>Guardar</button>
                    <button onclick="cancelarForm()" class="btn-borde">Cancelar</button>
                </div>
            </div>
        </div>

        <div class="row g-4" id="serviciosContainer"></div>
    </div>

    <div id="seccionBarberos" style="display:none;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="section-title mb-0">Gestion de Barberos</h4>
            <button onclick="mostrarFormBarbero()" class="btn-rojo">
                <i class="bi bi-plus-circle me-1"></i>Nuevo Barbero
            </button>
        </div>

        <div id="formBarbero" style="display:none;background:var(--card);border:1px solid var(--borde);border-radius:8px;padding:1.5rem;" class="mb-4">
            <h5 style="font-family:'Bebas Neue';letter-spacing:3px;color:var(--texto);margin-bottom:1rem;">Nuevo Barbero</h5>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">NOMBRE *</label>
                    <input type="text" id="nombreBarbero" class="form-control mt-1">
                </div>
                <div class="col-md-6">
                    <label class="form-label">CORREO *</label>
                    <input type="email" id="emailBarbero" class="form-control mt-1">
                </div>
                <div class="col-md-6">
                    <label class="form-label">TELEFONO</label>
                    <input type="text" id="telefonoBarbero" class="form-control mt-1">
                </div>
                <div class="col-md-6">
                    <label class="form-label">CONTRASEÑA *</label>
                    <input type="password" id="passwordBarbero" class="form-control mt-1">
                </div>
                <div class="col-12 d-flex gap-2">
                    <button onclick="guardarBarbero()" class="btn-rojo"><i class="bi bi-check-lg me-1"></i>Guardar</button>
                    <button onclick="cancelarFormBarbero()" class="btn-borde">Cancelar</button>
                </div>
            </div>
        </div>

        <div class="row g-4" id="barberosContainer"></div>
    </div>
</div>

<footer>© 2026 <span>MF Barber Studio</span> · Neiva, Huila, Colombia</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/servicios.js"></script>
<script>
    verificarAuth();
    const usuario = getUsuario();
    if (usuario.rol !== 'admin') window.location.href = 'login.html';
    document.getElementById('nombreAdmin').textContent = usuario.nombre;
    cargarTodasReservas();

    function mostrarTab(tab) {
        document.getElementById('seccionReservas').style.display = tab === 'reservas' ? 'block' : 'none';
        document.getElementById('seccionServicios').style.display = tab === 'servicios' ? 'block' : 'none';
        document.getElementById('seccionBarberos').style.display = tab === 'barberos' ? 'block' : 'none';
        document.getElementById('tabReservas').classList.toggle('active', tab === 'reservas');
        document.getElementById('tabServicios').classList.toggle('active', tab === 'servicios');
        document.getElementById('tabBarberos').classList.toggle('active', tab === 'barberos');
        if (tab === 'servicios') cargarServiciosAdmin();
        if (tab === 'barberos') cargarBarberos();
    }

    /* ---------- SERVICIOS ---------- */
    function mostrarFormServicio() {
        document.getElementById('tituloForm').textContent = 'Nuevo Servicio';
        document.getElementById('servicioId').value = '';
        document.getElementById('nombreServicio').value = '';
        document.getElementById('precioServicio').value = '17000';
        document.getElementById('imagenServicio').value = '';
        document.getElementById('imagenFile').value = '';
        document.getElementById('descripcionServicio').value = '';
        document.getElementById('previewContainer').style.display = 'none';
        document.getElementById('formServicio').style.display = 'block';
        document.getElementById('formServicio').scrollIntoView({behavior:'smooth'});
    }

    function cancelarForm() {
        document.getElementById('formServicio').style.display = 'none';
    }

    function previsualizarImagen(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('previewContainer').style.display = 'block';
                document.getElementById('imagenServicio').value = input.files[0].name;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function cargarServiciosAdmin() {
        try {
            const servicios = await apiRequest('GET', '/servicios/');
            document.getElementById('serviciosContainer').innerHTML = servicios.map(s => `
                <div class="col-md-4">
                    <div class="serv-card">
                        <img src="img/${s.imagen}"
                             onerror="this.src='https://via.placeholder.com/400x150/151515/A71925?text=MF+BARBER'"
                             alt="${s.nombre}">
                        <div class="serv-body">
                            <p class="serv-nombre">${s.nombre}</p>
                            <p class="serv-precio">$${Number(s.precio).toLocaleString()}</p>
                            <div class="d-flex gap-2">
                                <button onclick="editarServicio(${s.id},'${s.nombre.replace(/'/g,"\\'")}',${s.precio},'${s.imagen||''}','${s.descripcion||''}')"
                                        class="btn-borde flex-grow-1">
                                    <i class="bi bi-pencil me-1"></i>Editar
                                </button>
                                <button onclick="eliminarServicio(${s.id})"
                                        style="background:transparent;border:1px solid #4d1a1a;color:#ff6b6b;font-family:'Oswald';letter-spacing:1px;font-size:12px;padding:6px 12px;border-radius:4px;cursor:pointer;transition:all 0.3s;"
                                        onmouseover="this.style.background='#4d1a1a'"
                                        onmouseout="this.style.background='transparent'">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch(e) { console.error(e); }
    }

    function editarServicio(id, nombre, precio, imagen, descripcion) {
        document.getElementById('tituloForm').textContent = 'Editar Servicio';
        document.getElementById('servicioId').value = id;
        document.getElementById('nombreServicio').value = nombre;
        document.getElementById('precioServicio').value = precio;
        document.getElementById('imagenServicio').value = imagen;
        document.getElementById('descripcionServicio').value = descripcion;
        if (imagen) {
            document.getElementById('previewImg').src = 'img/' + imagen;
            document.getElementById('previewContainer').style.display = 'block';
        }
        document.getElementById('formServicio').style.display = 'block';
        document.getElementById('formServicio').scrollIntoView({behavior:'smooth'});
    }

    async function guardarServicio() {
        const id = document.getElementById('servicioId').value;
        const fileInput = document.getElementById('imagenFile');
        const nombre = document.getElementById('nombreServicio').value;
        const precio = document.getElementById('precioServicio').value;
        const descripcion = document.getElementById('descripcionServicio').value;

        if (!nombre || !precio) { alert('Llena los campos obligatorios'); return; }

        const formData = new FormData();
        formData.append('nombre', nombre);
        formData.append('precio', precio);
        formData.append('descripcion', descripcion);
        formData.append('id_categoria', '1');

        if (fileInput.files && fileInput.files[0]) {
            formData.append('imagen', fileInput.files[0]);
        }

        try {
            if (id) {
                await apiUpload('PUT', `/servicios/${id}`, formData, getToken());
                alert('Servicio actualizado con imagen!');
            } else {
                await apiUpload('POST', '/servicios/', formData, getToken());
                alert('Servicio creado con imagen!');
            }
            cancelarForm();
            cargarServiciosAdmin();
        } catch(e) {
            alert('Error: ' + e.message);
        }
    }

    async function eliminarServicio(id) {
        if (!confirm('Seguro que quieres eliminar este servicio?')) return;
        try {
            await apiRequest('DELETE', `/servicios/${id}`, null, getToken());
            alert('Servicio eliminado');
            cargarServiciosAdmin();
        } catch(e) { alert('Error: ' + e.message); }
    }

    /* ---------- BARBEROS ---------- */
    function mostrarFormBarbero() {
        ['nombreBarbero','emailBarbero','telefonoBarbero','passwordBarbero'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('formBarbero').style.display = 'block';
    }

    function cancelarFormBarbero() {
        document.getElementById('formBarbero').style.display = 'none';
    }

    async function cargarBarberos() {
        try {
            const barberos = await apiRequest('GET', '/usuarios/barberos');
            document.getElementById('barberosContainer').innerHTML = barberos.map(b => `
                <div class="col-md-4">
                    <div class="serv-card">
                        <img src="${b.foto ? 'img/' + b.foto : 'https://via.placeholder.com/400x150/151515/A71925?text=' + encodeURIComponent(b.nombre)}"
                             onerror="this.src='https://via.placeholder.com/400x150/151515/A71925?text=MF+BARBER'"
                             alt="${b.nombre}">
                        <div class="serv-body">
                            <p class="serv-nombre">${b.nombre}</p>
                            <p style="color:var(--texto-sec);font-size:13px;margin-bottom:8px;">${b.email}<br>${b.telefono || ''}</p>
                            <button onclick="eliminarBarbero(${b.id})"
                                    style="background:transparent;border:1px solid #4d1a1a;color:#ff6b6b;font-family:'Oswald';letter-spacing:1px;font-size:12px;padding:6px 12px;border-radius:4px;cursor:pointer;">
                                <i class="bi bi-trash me-1"></i>Borrar
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch(e) { console.error(e); }
    }

    async function guardarBarbero() {
        const nombre = document.getElementById('nombreBarbero').value;
        const email = document.getElementById('emailBarbero').value;
        const telefono = document.getElementById('telefonoBarbero').value;
        const password = document.getElementById('passwordBarbero').value;
        if (!nombre || !email || !password) { alert('Llena los campos obligatorios'); return; }
        try {
            await apiRequest('POST', '/usuarios/barberos',
                { rol: 'barbero', nombre, email, password, telefono, direccion: '' },
                getToken());
            alert('Barbero creado');
            cancelarFormBarbero();
            cargarBarberos();
        } catch(e) { alert('Error: ' + e.message); }
    }

    async function eliminarBarbero(id) {
        if (!confirm('Seguro que quieres borrar este barbero?')) return;
        try {
            await apiRequest('DELETE', `/usuarios/barberos/${id}`, null, getToken());
            alert('Barbero eliminado');
            cargarBarberos();
        } catch(e) { alert('Error: ' + e.message); }
    }
</script>
</body>
</html>
