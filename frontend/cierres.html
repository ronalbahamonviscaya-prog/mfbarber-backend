<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cierres de Ventas — MF Barber Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        :root {
            --rojo:#A71925;--rojo-hover:#C51F2C;--negro:#080808;
            --navbar:#0D0D0D;--card:#151515;--texto:#F5F5F5;
            --texto-sec:#A6A6A6;--borde:#292929;
        }
        body { background:var(--negro);color:var(--texto);min-height:100vh;font-family:'Rajdhani',sans-serif; }
        .navbar { background:var(--navbar);border-bottom:1px solid var(--borde);padding:0.8rem 2rem;position:sticky;top:0;z-index:999; }
        .navbar-brand { display:flex;align-items:center;gap:12px;text-decoration:none; }
        .navbar-brand img { height:40px;filter:invert(1); }
        .navbar-brand span { font-family:'Bebas Neue';font-size:1.5rem;letter-spacing:4px;color:var(--texto); }
        .btn-salir { background:transparent;border:1px solid var(--borde);color:var(--texto-sec);font-family:'Oswald';letter-spacing:2px;font-size:12px;padding:6px 15px;border-radius:4px;transition:all 0.3s; }
        .btn-salir:hover { border-color:var(--rojo);color:var(--rojo); }
        .stat-card { background:var(--card);border:1px solid var(--borde);border-radius:8px;padding:1.5rem;text-align:center;transition:all 0.3s; }
        .stat-card:hover { border-color:var(--rojo); }
        .stat-num { font-family:'Bebas Neue';font-size:2.5rem;color:var(--rojo);margin-bottom:3px; }
        .stat-label { font-family:'Oswald';color:var(--texto-sec);letter-spacing:2px;font-size:11px; }
        .section-title { font-family:'Bebas Neue';letter-spacing:4px;color:var(--texto);font-size:1.5rem; }
        .btn-rojo { background:var(--rojo);color:#fff;font-family:'Oswald';letter-spacing:2px;padding:8px 20px;border:none;border-radius:4px;transition:all 0.3s;cursor:pointer; }
        .btn-rojo:hover { background:var(--rojo-hover); }
        footer { background:var(--navbar);border-top:1px solid var(--borde);padding:15px;text-align:center;color:var(--texto-sec);font-family:'Oswald';font-size:12px;letter-spacing:2px;margin-top:3rem; }
        footer span { color:var(--rojo); }
    </style>
</head>
<body>
<nav class="navbar d-flex justify-content-between align-items-center">
    <a class="navbar-brand" href="index.html">
        <img src="img/logo.jpg" alt="logo">
        <span>MF BARBER — CIERRES</span>
    </a>
    <div class="d-flex align-items-center gap-3">
        <a href="dashboard_admin.html" style="font-family:'Oswald';color:var(--texto-sec);font-size:13px;text-decoration:none;">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
        <button onclick="cerrarSesion()" class="btn-salir"><i class="bi bi-box-arrow-right me-1"></i>Salir</button>
    </div>
</nav>

<div class="container mt-4">
    <h2 style="font-family:'Bebas Neue';letter-spacing:4px;font-size:2rem;">Cierres de <span style="color:var(--rojo);">Ventas</span></h2>
    <p style="font-family:'Oswald';color:var(--texto-sec);letter-spacing:3px;font-size:12px;margin-bottom:2rem;">MF BARBER STUDIO 2026</p>

    <!-- FILTRO DE FECHA -->
    <div style="background:var(--card);border:1px solid var(--borde);border-radius:8px;padding:1.5rem;margin-bottom:2rem;">
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label style="font-family:'Oswald';color:var(--texto-sec);font-size:11px;letter-spacing:3px;display:block;margin-bottom:5px;">FECHA INICIO</label>
                <input type="date" id="fechaInicio"
                       style="width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--borde);color:var(--texto);border-radius:4px;padding:10px 14px;font-family:'Oswald';">
            </div>
            <div class="col-md-4">
                <label style="font-family:'Oswald';color:var(--texto-sec);font-size:11px;letter-spacing:3px;display:block;margin-bottom:5px;">FECHA FIN</label>
                <input type="date" id="fechaFin"
                       style="width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--borde);color:var(--texto);border-radius:4px;padding:10px 14px;font-family:'Oswald';">
            </div>
            <div class="col-md-4">
                <button onclick="calcularCierres()" class="btn-rojo w-100">
                    <i class="bi bi-calculator me-2"></i>Calcular
                </button>
            </div>
        </div>
        <div class="d-flex gap-2 mt-3 flex-wrap">
            <button onclick="setHoy()" style="background:transparent;border:1px solid var(--borde);color:var(--texto-sec);font-family:'Oswald';font-size:11px;letter-spacing:2px;padding:5px 15px;border-radius:3px;cursor:pointer;transition:all 0.3s;"
                    onmouseover="this.style.borderColor='#A71925';this.style.color='#A71925'"
                    onmouseout="this.style.borderColor='var(--borde)';this.style.color='var(--texto-sec)'">HOY</button>
            <button onclick="setEstaSemana()" style="background:transparent;border:1px solid var(--borde);color:var(--texto-sec);font-family:'Oswald';font-size:11px;letter-spacing:2px;padding:5px 15px;border-radius:3px;cursor:pointer;transition:all 0.3s;"
                    onmouseover="this.style.borderColor='#A71925';this.style.color='#A71925'"
                    onmouseout="this.style.borderColor='var(--borde)';this.style.color='var(--texto-sec)'">ESTA SEMANA</button>
            <button onclick="setEsteMes()" style="background:transparent;border:1px solid var(--borde);color:var(--texto-sec);font-family:'Oswald';font-size:11px;letter-spacing:2px;padding:5px 15px;border-radius:3px;cursor:pointer;transition:all 0.3s;"
                    onmouseover="this.style.borderColor='#A71925';this.style.color='#A71925'"
                    onmouseout="this.style.borderColor='var(--borde)';this.style.color='var(--texto-sec)'">ESTE MES</button>
        </div>
    </div>

    <!-- STATS GENERALES -->
    <div class="row g-3 mb-4" id="statsGenerales" style="display:none;">
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <p class="stat-num" id="totalCortes">0</p>
                <p class="stat-label">CORTES REALIZADOS</p>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <p class="stat-num" id="totalIngresos">$0</p>
                <p class="stat-label">INGRESOS TOTALES</p>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card" style="border-color:rgba(167,25,37,0.3);">
                <p class="stat-num" id="totalPendientes">0</p>
                <p class="stat-label">PENDIENTES</p>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <p class="stat-num" id="totalCancelados">0</p>
                <p class="stat-label">CANCELADOS</p>
            </div>
        </div>
    </div>

    <!-- GANANCIAS POR BARBERO -->
    <div id="seccionBarberos" style="display:none;margin-bottom:2rem;">
        <h4 class="section-title mb-3">Ganancias por Barbero</h4>

        <div style="background:var(--card);border:1px solid var(--borde);border-radius:8px;padding:1.5rem;margin-bottom:1.5rem;">
            <label style="font-family:'Oswald';color:var(--texto-sec);font-size:11px;letter-spacing:3px;display:block;margin-bottom:10px;">DIVISION DE GANANCIAS</label>
            <div class="d-flex gap-3 flex-wrap">
                <button onclick="setPorcentaje(50,50)" id="btn5050"
                        style="background:rgba(167,25,37,0.2);border:1px solid var(--rojo);color:var(--rojo);font-family:'Oswald';letter-spacing:2px;font-size:12px;padding:8px 20px;border-radius:4px;cursor:pointer;">
                    50% / 50%
                </button>
                <button onclick="setPorcentaje(60,40)" id="btn6040"
                        style="background:transparent;border:1px solid var(--borde);color:var(--texto-sec);font-family:'Oswald';letter-spacing:2px;font-size:12px;padding:8px 20px;border-radius:4px;cursor:pointer;">
                    60% Negocio / 40% Barbero
                </button>
                <button onclick="setPorcentaje(40,60)" id="btn4060"
                        style="background:transparent;border:1px solid var(--borde);color:var(--texto-sec);font-family:'Oswald';letter-spacing:2px;font-size:12px;padding:8px 20px;border-radius:4px;cursor:pointer;">
                    40% Negocio / 60% Barbero
                </button>
            </div>
        </div>

        <div class="row g-3" id="cardsBarberos"></div>
    </div>

    <!-- TABLA DETALLE -->
    <div id="seccionDetalle" style="display:none;">
        <h4 class="section-title mb-3">Detalle de Reservas</h4>
        <div id="tablaDetalle" style="overflow-x:auto;"></div>
    </div>
</div>

<footer>© 2026 <span>MF Barber Studio</span> · Neiva, Huila, Colombia</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script>
    verificarAuth();
    const usuario = getUsuario();
    if (usuario.rol !== 'admin') window.location.href = 'login.html';

    const PRECIO_POR_DEFECTO = 20000;
    let porcentajeNegocio = 50;
    let porcentajeBarbero = 50;
    let reservasPeriodo = [];   // todas las del rango (cualquier estado)
    let reservasActuales = [];  // solo las Listo del rango
    let barberosLista = [];
    let precios = {};
    let hayDatos = false;

    // Fecha local (no UTC) en formato YYYY-MM-DD
    function fechaLocal(d = new Date()) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const dia = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${dia}`;
    }

    function setHoy() {
        const hoy = fechaLocal();
        document.getElementById('fechaInicio').value = hoy;
        document.getElementById('fechaFin').value = hoy;
        calcularCierres();
    }

    function setEstaSemana() {
        const hoy = new Date();
        const dia = hoy.getDay() || 7; // domingo = 7
        const lunes = new Date(hoy);
        lunes.setDate(hoy.getDate() - dia + 1);
        const domingo = new Date(lunes);
        domingo.setDate(lunes.getDate() + 6);
        document.getElementById('fechaInicio').value = fechaLocal(lunes);
        document.getElementById('fechaFin').value = fechaLocal(domingo);
        calcularCierres();
    }

    function setEsteMes() {
        const hoy = new Date();
        const inicio = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
        const fin = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0);
        document.getElementById('fechaInicio').value = fechaLocal(inicio);
        document.getElementById('fechaFin').value = fechaLocal(fin);
        calcularCierres();
    }

    function setPorcentaje(negocio, barbero) {
        porcentajeNegocio = negocio;
        porcentajeBarbero = barbero;
        ['btn5050','btn6040','btn4060'].forEach(id => {
            const btn = document.getElementById(id);
            btn.style.background = 'transparent';
            btn.style.borderColor = 'var(--borde)';
            btn.style.color = 'var(--texto-sec)';
        });
        const btnId = negocio === 50 ? 'btn5050' : negocio === 60 ? 'btn6040' : 'btn4060';
        const btn = document.getElementById(btnId);
        btn.style.background = 'rgba(167,25,37,0.2)';
        btn.style.borderColor = '#A71925';
        btn.style.color = '#A71925';
        if (hayDatos) mostrarResultados();
    }

    function valorReserva(r) {
        return precios[r.id_servicio] ?? PRECIO_POR_DEFECTO;
    }

    function listaBarberos() {
        const mapa = {};
        barberosLista.forEach(b => { mapa[b.id] = { id: b.id, nombre: b.nombre, foto: b.foto }; });
        // barberos desactivados que tienen cortes en el periodo
        reservasActuales.forEach(r => {
            if (r.id_barbero && !mapa[r.id_barbero]) {
                mapa[r.id_barbero] = { id: r.id_barbero, nombre: r.nombre_barbero, foto: null };
            }
        });
        return Object.values(mapa);
    }

    async function calcularCierres() {
        const inicio = document.getElementById('fechaInicio').value;
        const fin = document.getElementById('fechaFin').value;
        if (!inicio || !fin) { alert('Selecciona un rango de fechas'); return; }

        try {
            const [reservas, servicios, barberos] = await Promise.all([
                apiRequest('GET', '/reservas/', null, getToken()),
                apiRequest('GET', '/servicios/'),
                apiRequest('GET', '/usuarios/barberos')
            ]);
            precios = {};
            servicios.forEach(s => { precios[s.id] = Number(s.precio); });
            barberosLista = barberos;

            reservasPeriodo = reservas.filter(r => r.fecha_reserva >= inicio && r.fecha_reserva <= fin);
            reservasActuales = reservasPeriodo.filter(r => r.estado === 'Listo');
            hayDatos = true;
            mostrarResultados();
        } catch(e) {
            alert('Error: ' + e.message);
        }
    }

    function mostrarResultados() {
        const reservas = reservasActuales;

        const totalIngresos = reservas.reduce((suma, r) => suma + valorReserva(r), 0);
        document.getElementById('totalCortes').textContent = reservas.length;
        document.getElementById('totalIngresos').textContent = '$' + totalIngresos.toLocaleString();
        document.getElementById('totalPendientes').textContent =
            reservasPeriodo.filter(r => r.estado === 'Pendiente' || r.estado === 'En Curso').length;
        document.getElementById('totalCancelados').textContent =
            reservasPeriodo.filter(r => r.estado === 'Cancelado').length;

        document.getElementById('statsGenerales').style.display = 'flex';
        document.getElementById('seccionBarberos').style.display = 'block';
        document.getElementById('seccionDetalle').style.display = 'block';

        const cardsBarberos = document.getElementById('cardsBarberos');
        cardsBarberos.innerHTML = listaBarberos().map(b => {
            const cortesB = reservas.filter(r => r.id_barbero === b.id);
            const ingresosB = cortesB.reduce((suma, r) => suma + valorReserva(r), 0);
            const gananciaB = Math.round(ingresosB * porcentajeBarbero / 100);
            const gananciaNegocio = Math.round(ingresosB * porcentajeNegocio / 100);
            return `
                <div class="col-md-6">
                    <div style="background:var(--card);border:1px solid var(--borde);border-radius:8px;padding:1.5rem;">
                        <div style="display:flex;align-items:center;gap:12px;margin-bottom:1.5rem;">
                            <img src="img/${b.foto || 'logo.jpg'}" style="width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid #A71925;background:#0D0D0D;"
                                 onerror="this.onerror=null;this.src='img/logo.jpg'">
                            <div>
                                <h5 style="font-family:'Bebas Neue';letter-spacing:3px;color:var(--texto);margin:0;font-size:1.2rem;">${b.nombre}</h5>
                                <p style="font-family:'Oswald';color:#A71925;font-size:11px;letter-spacing:2px;margin:0;">BARBERO</p>
                            </div>
                        </div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                            <div style="background:#080808;border:1px solid var(--borde);border-radius:6px;padding:12px;text-align:center;">
                                <p style="font-family:'Bebas Neue';font-size:1.8rem;color:#A71925;margin:0;">${cortesB.length}</p>
                                <p style="font-family:'Oswald';color:var(--texto-sec);font-size:10px;letter-spacing:2px;margin:0;">CORTES</p>
                            </div>
                            <div style="background:#080808;border:1px solid var(--borde);border-radius:6px;padding:12px;text-align:center;">
                                <p style="font-family:'Bebas Neue';font-size:1.8rem;color:#A71925;margin:0;">$${ingresosB.toLocaleString()}</p>
                                <p style="font-family:'Oswald';color:var(--texto-sec);font-size:10px;letter-spacing:2px;margin:0;">GENERADO</p>
                            </div>
                        </div>
                        <div style="margin-top:12px;background:rgba(167,25,37,0.08);border:1px solid rgba(167,25,37,0.2);border-radius:6px;padding:12px;">
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                                <span style="font-family:'Oswald';color:var(--texto-sec);font-size:11px;letter-spacing:2px;">NEGOCIO (${porcentajeNegocio}%)</span>
                                <span style="font-family:'Bebas Neue';font-size:1.3rem;color:var(--texto);">$${gananciaNegocio.toLocaleString()}</span>
                            </div>
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <span style="font-family:'Oswald';color:var(--texto-sec);font-size:11px;letter-spacing:2px;">BARBERO (${porcentajeBarbero}%)</span>
                                <span style="font-family:'Bebas Neue';font-size:1.3rem;color:#25D366;">$${gananciaB.toLocaleString()}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        document.getElementById('tablaDetalle').innerHTML = reservas.length === 0 ?
            `<div style="text-align:center;padding:2rem;color:var(--texto-sec);font-family:'Oswald';">No hay cortes completados en este periodo</div>` :
            `<div style="background:var(--card);border:1px solid var(--borde);border-radius:8px;overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;min-width:600px;">
                    <thead>
                        <tr style="background:#0D0D0D;">
                            <th style="padding:12px 16px;font-family:'Oswald';color:#A71925;letter-spacing:2px;font-size:12px;border-bottom:1px solid #292929;">#</th>
                            <th style="padding:12px 16px;font-family:'Oswald';color:#A71925;letter-spacing:2px;font-size:12px;border-bottom:1px solid #292929;">CLIENTE</th>
                            <th style="padding:12px 16px;font-family:'Oswald';color:#A71925;letter-spacing:2px;font-size:12px;border-bottom:1px solid #292929;">BARBERO</th>
                            <th style="padding:12px 16px;font-family:'Oswald';color:#A71925;letter-spacing:2px;font-size:12px;border-bottom:1px solid #292929;">FECHA</th>
                            <th style="padding:12px 16px;font-family:'Oswald';color:#A71925;letter-spacing:2px;font-size:12px;border-bottom:1px solid #292929;">HORA</th>
                            <th style="padding:12px 16px;font-family:'Oswald';color:#A71925;letter-spacing:2px;font-size:12px;border-bottom:1px solid #292929;">VALOR</th>
                            <th style="padding:12px 16px;font-family:'Oswald';color:#A71925;letter-spacing:2px;font-size:12px;border-bottom:1px solid #292929;">BARBERO GANA</th>
                        </tr>
                    </thead>
                    <tbody>
                    ${reservas.map(r => {
                        const valor = valorReserva(r);
                        const ganancia = Math.round(valor * porcentajeBarbero / 100);
                        return `
                        <tr style="border-bottom:1px solid #1a1a1a;">
                            <td style="padding:12px 16px;color:#F5F5F5;font-family:'Rajdhani';">${r.id}</td>
                            <td style="padding:12px 16px;color:#F5F5F5;font-family:'Oswald';font-size:13px;">${r.nombre_cliente}</td>
                            <td style="padding:12px 16px;color:#F5F5F5;font-family:'Oswald';font-size:13px;">${r.nombre_barbero}</td>
                            <td style="padding:12px 16px;color:#A6A6A6;font-family:'Rajdhani';white-space:nowrap;">${r.fecha_reserva}</td>
                            <td style="padding:12px 16px;color:#A6A6A6;font-family:'Rajdhani';white-space:nowrap;">${r.hora_reserva}</td>
                            <td style="padding:12px 16px;font-family:'Bebas Neue';font-size:1.2rem;color:#A71925;">$${valor.toLocaleString()}</td>
                            <td style="padding:12px 16px;font-family:'Bebas Neue';font-size:1.2rem;color:#25D366;">$${ganancia.toLocaleString()}</td>
                        </tr>`;
                    }).join('')}
                    </tbody>
                </table>
            </div>`;
    }

    // Al abrir: mes actual y calcula solo
    setEsteMes();
</script>
</body>
</html>
