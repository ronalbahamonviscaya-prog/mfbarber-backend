<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Cliente — MF Barber Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        :root {
            --rojo:#A71925;--rojo-hover:#C51F2C;--negro:#080808;
            --navbar:#0D0D0D;--card:#151515;--texto:#F5F5F5;
            --texto-sec:#A6A6A6;--borde:#292929;
        }
        body { background:var(--negro);color:var(--texto);min-height:100vh;font-family:'Rajdhani',sans-serif; }
        .navbar { background:var(--navbar);border-bottom:1px solid var(--borde);padding:0.8rem 2rem;position:sticky;top:0;z-index:999; }
        .navbar-brand { display:flex;align-items:center;gap:12px;text-decoration:none; }
        .navbar-brand img { height:40px;filter:invert(1); }
        .navbar-brand span { font-family:'Bebas Neue';font-size:1.5rem;letter-spacing:4px;color:var(--texto); }
        .nav-user { font-family:'Oswald';color:var(--texto-sec);letter-spacing:2px;font-size:13px; }
        .btn-salir { background:transparent;border:1px solid var(--borde);color:var(--texto-sec);font-family:'Oswald';letter-spacing:2px;font-size:12px;padding:6px 15px;border-radius:4px;transition:all 0.3s; }
        .btn-salir:hover { border-color:var(--rojo);color:var(--rojo); }
        .page-title { font-family:'Bebas Neue';letter-spacing:5px;color:var(--texto);font-size:2rem;margin-bottom:3px; }
        .page-sub { font-family:'Oswald';color:var(--texto-sec);letter-spacing:3px;font-size:12px; }
        .nav-tabs { border-color:var(--borde); }
        .nav-tabs .nav-link { font-family:'Oswald';letter-spacing:2px;color:var(--texto-sec);background:transparent;border-color:transparent;font-size:13px;padding:10px 20px; }
        .nav-tabs .nav-link.active { color:#ffffff;background:rgba(167,25,37,0.15);border-color:var(--rojo) var(--rojo) transparent;border-bottom:2px solid var(--rojo); }
        .nav-tabs .nav-link:hover { color:var(--texto); }
        .section-title { font-family:'Bebas Neue';letter-spacing:4px;color:var(--texto);font-size:1.5rem;margin-bottom:1rem; }
        .corte-card { background:var(--card);border:1px solid var(--borde);border-radius:8px;overflow:hidden;transition:all 0.3s; }
        .corte-card:hover { border-color:var(--rojo);transform:translateY(-3px); }
        .corte-card img { width:100%;height:180px;object-fit:cover; }
        .corte-body { padding:1rem;text-align:center; }
        .corte-nombre { font-family:'Oswald';color:var(--texto);font-size:13px;margin-bottom:3px; }
        .corte-precio { font-family:'Bebas Neue';font-size:1.8rem;color:var(--rojo);margin-bottom:8px; }
        .btn-reservar { background:var(--rojo);color:#fff;font-family:'Oswald';letter-spacing:2px;padding:8px;border:none;border-radius:4px;width:100%;transition:all 0.3s;cursor:pointer; }
        .btn-reservar:hover { background:var(--rojo-hover); }
        .tabla-card { background:var(--card);border:1px solid var(--borde);border-radius:8px;overflow:hidden; }
        .table-dark { background:var(--card)!important; }
        .table-dark th { color:var(--rojo)!important;border-color:var(--borde)!important;font-family:'Oswald';letter-spacing:2px;font-size:12px; }
        .table-dark td { border-color:var(--borde)!important;color:var(--texto);font-family:'Rajdhani'; }
        .btn-nueva { background:var(--rojo);color:#fff;font-family:'Oswald';letter-spacing:2px;padding:8px 20px;border:none;border-radius:4px;transition:all 0.3s; }
        .btn-nueva:hover { background:var(--rojo-hover);color:#fff; }
        footer { background:var(--navbar);border-top:1px solid var(--borde);padding:15px;text-align:center;color:var(--texto-sec);font-family:'Oswald';font-size:12px;letter-spacing:2px;margin-top:3rem; }
        footer span { color:var(--rojo); }
    </style>
</head>
<body>
<nav class="navbar d-flex justify-content-between align-items-center">
    <a class="navbar-brand" href="index.html">
        <img src="img/logo.jpg" alt="logo">
        <span>MF BARBER</span>
    </a>
    <div class="d-flex align-items-center gap-3">
        <span class="nav-user"><i class="bi bi-person-circle me-1" style="color:var(--rojo);"></i><span id="nombreUsuario"></span></span>
        <button onclick="cerrarSesion()" class="btn-salir"><i class="bi bi-box-arrow-right me-1"></i>Salir</button>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="page-title">Bienvenido, <span id="nombreBienvenida" style="color:var(--rojo);"></span></h2>
    <p class="page-sub">PANEL DE CLIENTE · MF BARBER STUDIO 2026</p>

    <ul class="nav nav-tabs mt-4 mb-4">
        <li class="nav-item">
            <button class="nav-link active" onclick="mostrarTab('servicios')" id="tabServicios">
                <i class="bi bi-scissors me-1"></i>CORTES
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" onclick="mostrarTab('reservas')" id="tabReservas">
                <i class="bi bi-calendar-check me-1"></i>MIS RESERVAS
            </button>
        </li>
    </ul>

    <div id="seccionServicios">
        <h4 class="section-title">Nuestros Cortes — $20.000</h4>
        <div class="row g-4" id="serviciosContainer"></div>
    </div>

    <div id="seccionReservas" style="display:none;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="section-title mb-0">Mis Reservas</h4>
            <button onclick="mostrarTab('servicios')" class="btn-nueva">
                <i class="bi bi-plus-circle me-1"></i>Nueva Reserva
            </button>
        </div>
        <div id="misReservas"></div>
    </div>
</div>

<footer>© 2026 <span>MF Barber Studio</span> · Neiva, Huila, Colombia</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/servicios.js"></script>
<script>
    verificarAuth();
    const usuario = getUsuario();
    if (usuario.rol !== 'cliente') window.location.href = 'login.html';
    document.getElementById('nombreUsuario').textContent = usuario.nombre;
    document.getElementById('nombreBienvenida').textContent = usuario.nombre;
    cargarServicios();

    function mostrarTab(tab) {
        document.getElementById('seccionServicios').style.display = tab === 'servicios' ? 'block' : 'none';
        document.getElementById('seccionReservas').style.display = tab === 'reservas' ? 'block' : 'none';
        document.getElementById('tabServicios').classList.toggle('active', tab === 'servicios');
        document.getElementById('tabReservas').classList.toggle('active', tab === 'reservas');
        if (tab === 'reservas') cargarMisReservas();
    }
</script>
</body>
</html>
